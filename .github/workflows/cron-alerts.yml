# Web Push 백업 — 저장 직후 /api/alerts/dispatch 가 즉시 발송, cron은 놓친 건 보정
name: Cron alerts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron/alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: APP_URL or CRON_SECRET not configured in repo secrets."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/alerts"
